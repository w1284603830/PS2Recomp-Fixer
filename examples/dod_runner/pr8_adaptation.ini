# Reference-only settings to merge into dod.ini. Not loaded automatically.
# First verify your ELF against this runner/generated code and record its CRC32.
# A checksum pins that file; it is not an official release identity database.
confirmed_game_revision=
confirmed_elf_crc32=
# Keep both off until revision + CRC above are supplied and the path is qualified.
reference_particles=0
reference_hd_cg_scaling=0
# Optional, explicit static-page pack path, relative to the EXE or absolute.
# Empty means off; requires pages.tsv and the 512x448 -> 1536x1344 RGBA adapter.
ui_hd_dir=
# Existing GameIndex defaults stay in the reference runner; overrides remain here.
gs_options=
